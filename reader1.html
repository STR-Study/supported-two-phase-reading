<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STR Reading</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f5f0;
        color: #222;
        font-family: Georgia, "Times New Roman", serif;
    }

    main {
        text-align: center;
        padding: 40px 24px;
        max-width: 700px;
    }

    h1 {
        font-size: clamp(42px, 8vw, 72px);
        font-weight: 400;
        margin: 0 0 20px;
        letter-spacing: -2px;
    }

    p {
        font-size: 22px;
        line-height: 1.6;
        margin: 0 0 30px;
        color: #555;
    }

    .button {
        display: inline-block;
        padding: 14px 26px;
        background: #222;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 16px;
    }

    .button:hover {
        background: #444;
    }
</style>


</head>

<body>


<main>
    <h1>STR Reading</h1>

    <p>
        Read the same text twice.<br>
        First with support. Then without it.
    </p>

    <a class="button" href="#">Start reading</a>
</main>


</body>
</html>
